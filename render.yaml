# Render infrastructure configuration for ATS Resume Score Checker
# Apply this in the Render dashboard: Blueprint -> Connect this repository
# Secrets (JWT_SECRET_KEY, ALLOWED_ORIGINS) must be set in the Render dashboard,
# never in this file.

databases:
  - name: ats-resume-checker-db
    databaseName: ats_resume_checker
    user: ats_resume_user
    plan: starter

services:
  - type: web
    name: ats-resume-checker-api
    env: python
    plan: starter
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.10.11"
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: ats-resume-checker-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generate: true
      - key: ALLOWED_ORIGINS
        value: https://your-frontend.vercel.app
      - key: SENTENCE_TRANSFORMER_MODEL
        value: all-MiniLM-L6-v2
      - key: SPACY_MODEL
        value: en_core_web_sm
      - key: LOG_LEVEL
        value: INFO
      - key: MAX_FILE_SIZE_MB
        value: "10"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: RATE_LIMIT_DEFAULT
        value: "60"
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: "60"
      - key: RATE_LIMIT_AUTH
        value: "10"
      - key: RATE_LIMIT_ANALYSIS
        value: "20"
      - key: WEIGHT_KEYWORD_MATCH
        value: "30"
      - key: WEIGHT_TECHNICAL_SKILL
        value: "25"
      - key: WEIGHT_EXPERIENCE
        value: "20"
      - key: WEIGHT_STRUCTURE
        value: "10"
      - key: WEIGHT_EDUCATION
        value: "5"
      - key: WEIGHT_FORMATTING
        value: "10"
    disk:
      name: uploads-disk
      mountPath: /opt/render/project/src/backend/uploads
      sizeGB: 1
    healthCheckPath: /healthz
